<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editar vocabulário</title><style>
*{box-sizing:border-box}body{margin:0;background:#eeeefa;color:#292854;font:15px Arial,sans-serif}main{max-width:1180px;margin:24px auto;padding:16px}section{background:white;border-radius:20px;padding:22px;margin-top:16px}a{color:#514eaf;font-weight:bold}label{display:block;font-weight:bold;margin:8px 0}input,select,button{font:inherit;padding:10px;border:1px solid #ccc9e9;border-radius:8px}input{width:100%;min-width:100px}button{background:#625fca;color:white;cursor:pointer;font-weight:bold}button:disabled{opacity:.5}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:end}.controls>div{flex:1;min-width:180px}.controls select{width:100%}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:6px;border-bottom:1px solid #eee}th{white-space:nowrap}td:first-child{width:35px}#status{white-space:pre-wrap}#save{position:sticky;bottom:12px;box-shadow:0 3px 15px #0002}[hidden]{display:none!important}.match{background:#fff3cc}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js"></script><script src="profiles-client.js?v=20261126-vocab2"></script></head><body><main><a href="perfil.html">← Meu perfil</a><section><h1>Editar vocabulário</h1><p id="status" role="status">Verificando permissão…</p><div id="editor" hidden><p>Escolha uma unidade ou procure uma palavra. Edite diretamente as células e salve para atualizar os exercícios de todos os alunos.</p><div class="controls"><div><label for="lang">Idioma</label><select id="lang"><option value="pt">Português – francês</option><option value="de">Alemão – português</option></select></div><div><label for="search">Buscar palavra em todas as unidades</label><input id="search" placeholder="Ex.: homme, Haus, casa"></div><div><label for="unit">Unidade</label><select id="unit"></select></div></div><label for="title">Título da unidade</label><input id="title" maxlength="200"><p id="matches"></p><div class="table-wrap"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div><p>As unidades mantêm 25 palavras para preservar o funcionamento dos testes.</p><button id="save">Salvar alterações</button></div></section></main><script>
(async()=>{"use strict";const $=id=>document.getElementById(id),api=window.LanguageProfiles;let units=[],current=null,language="pt",dirty=false,busy=false;const status=t=>$("status").textContent=t;
if(!api){status("Serviço indisponível.");return;}await api.ready;if(!api.isEditor){status("Acesso restrito à conta administradora. Entre pelo Meu perfil.");return;}
api.client.auth.onAuthStateChange(()=>{if(!api.isEditor)setTimeout(()=>location.replace("perfil.html"),0);});
const keys=()=>language==="pt"?["fr","pt","classe"]:["de","pt","classe","nivel","artigo","plural"];
const labels={fr:"Francês",pt:"Português",de:"Alemão",classe:"Classe",nivel:"Nível",artigo:"Artigo",plural:"Plural"};
const norm=s=>String(s||"").normalize("NFC").toLowerCase().trim();
function match(word){const q=norm($("search").value);return !q||Object.values(word).some(v=>norm(v).includes(q));}
function choices(){const q=norm($("search").value);const found=units.filter(u=>!q||u.palavras.some(match));$("unit").replaceChildren();for(const u of found){const o=new Option("Unidade "+u.id+" · "+u.titulo+(q?" ("+u.palavras.filter(match).length+")":""),u.id);$("unit").add(o);}if(current&&found.some(u=>u.id===current.id))$("unit").value=current.id;return found;}
function render(unit){current=unit;dirty=false;$("title").value=unit.titulo;$("head").replaceChildren();const h=document.createElement("tr");for(const label of ["#",...keys().map(k=>labels[k])]){const th=document.createElement("th");th.textContent=label;h.append(th);}$("head").append(h);$("rows").replaceChildren();unit.palavras.forEach((word,i)=>{const tr=document.createElement("tr");if($("search").value.trim()&&match(word))tr.className="match";const n=document.createElement("td");n.textContent=i+1;tr.append(n);for(const k of keys()){const td=document.createElement("td"),input=document.createElement("input");input.value=word[k]||"";input.maxLength=500;input.dataset.key=k;input.setAttribute("aria-label",labels[k]+" "+(i+1));input.oninput=()=>dirty=true;td.append(input);tr.append(td);}$("rows").append(tr);});$("matches").textContent="25 palavras · "+unit.titulo;$("save").disabled=false;}
function allow(){return !dirty||confirm("Descartar alterações não salvas?");}
async function load(lang){busy=true;$("editor").hidden=true;status("Carregando vocabulário…");try{language=lang;const global=lang==="pt"?"VOCAB_UNITS":"GERMAN_VOCAB_UNITS";if(!window[global])await new Promise((resolve,reject)=>{const s=document.createElement("script");s.src=lang==="pt"?"testes-vocab-data.js":"testes-vocab-alemao-data.js";s.onload=resolve;s.onerror=reject;document.head.append(s);});units=await api.vocabulary(lang,window[global]);current=null;$("search").value="";choices();render(units[0]);$("editor").hidden=false;status("Modo administrador · alterações publicadas ao salvar.");}catch(e){status("Erro ao carregar: "+(e.message||"arquivo indisponível"));}finally{busy=false;}}
$("lang").onchange=()=>{if(busy||!allow()){$("lang").value=language;return;}load($("lang").value);};
$("unit").onchange=()=>{if(!allow()){$("unit").value=current.id;return;}const u=units.find(x=>x.id===Number($("unit").value));if(u)render(u);};
$("search").oninput=()=>{if(dirty){$("matches").textContent="Salve as alterações antes de buscar.";return;}const found=choices();if(!found.length){$("matches").textContent="Nenhuma palavra encontrada." ;return;}const u=found.find(x=>x.id===current?.id)||found[0];$("unit").value=u.id;render(u);};
$("title").oninput=()=>dirty=true;
$("save").onclick=async()=>{if(busy||!current||!api.isEditor)return;const title=$("title").value.trim();const words=[...$("rows").rows].map((row,i)=>{const word={...current.palavras[i]};for(const input of row.querySelectorAll("input")){const value=input.value.trim();if(value)word[input.dataset.key]=value;else delete word[input.dataset.key];}return word;});if(!title||words.some(w=>!w.pt||!w[language==="pt"?"fr":"de"]||!w.classe)){status("Preencha o título, as duas palavras e a classe de todas as linhas.");return;}busy=true;$("save").disabled=true;$("lang").disabled=true;$("unit").disabled=true;$("search").disabled=true;try{const {error}=await api.client.from("vocab_unit_edits").upsert({language,unit_id:current.id,title,words,updated_at:new Date().toISOString()},{onConflict:"language,unit_id"});if(error)throw error;current.titulo=title;current.palavras=words;dirty=false;choices();status("Alterações salvas! Os testes passam a usar esta versão ao serem abertos.");}catch(e){status("Não foi possível salvar: "+e.message);}finally{busy=false;$("save").disabled=false;$("lang").disabled=false;$("unit").disabled=false;$("search").disabled=false;}};
window.addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue="";}});
await load("pt");})();
</script><script src="site-language.js?v=20261128-1" defer></script>
</body></html>
