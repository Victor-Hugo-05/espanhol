<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marcar aulas</title><style>
*{box-sizing:border-box}body{margin:0;background:#eeeefa;color:#292854;font:15px Arial,sans-serif}main{max-width:800px;margin:24px auto;padding:16px}section{background:white;border:1px solid #e5e4fc;border-radius:20px;padding:22px;margin-top:16px}h1{margin-top:0}a{color:#514eaf;font-weight:bold}p{line-height:1.5}label{display:block;font-weight:bold;margin:10px 0 5px}input,select,button{font:inherit;padding:11px;border:1px solid #ccc9e9;border-radius:9px}input,select{width:100%}button{background:#625fca;color:white;cursor:pointer;font-weight:bold;margin-top:8px}button:disabled{opacity:.5;cursor:default}.slot{border:1px solid #dddff5;border-radius:12px;padding:14px;margin:9px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.slot p{margin:4px 0}.muted{color:#686b80;font-size:13px}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}[hidden]{display:none!important}.pending{background:#fff7dd}.confirmed{background:#e8f8ed}#status{white-space:pre-wrap}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js"></script><script src="profiles-client.js?v=20261126-vocab2"></script></head><body><main><a href="index.html">← Início</a> · <a href="perfil.html">Meu perfil</a><section><h1>📅 Marcar aulas</h1><p>Uma aula por semana (segunda a domingo), com no mínimo 72 horas de antecedência. Todos os horários são de Paris.</p><p id="status" role="status" aria-live="polite">Carregando…</p><p id="guest" hidden><a href="perfil.html">Entre ou crie sua conta</a> para reservar.</p></section><section id="admin" hidden><h2>Disponibilizar horários</h2><form id="publish"><div class="fields"><div><label for="day">Data (Paris)</label><input id="day" type="date" required></div><div><label for="time">Início</label><input id="time" type="time" required></div><div><label for="duration">Duração (min)</label><input id="duration" type="number" min="15" max="240" step="5" value="60" required></div><div><label for="language">Idioma</label><select id="language"><option value="pt">Português</option><option value="es">Espanhol</option><option value="de">Alemão</option><option value="other">Outro</option></select></div></div><button>Publicar horário</button></form><h3>Horários publicados</h3><div id="teacherSlots"></div></section><section id="available" hidden><h2>Horários disponíveis</h2><div id="slots"></div></section><section id="mine" hidden><h2>Minhas aulas</h2><div id="bookings"></div></section></main><script>
(async()=>{"use strict";
const $=id=>document.getElementById(id),api=window.LanguageProfiles,client=api?.client;
const status=t=>$("status").textContent=t;
if(!client){status("Serviço indisponível.");return;}await api.ready;
const user=api.user;if(!user){$("guest").hidden=false;status("Faça login para continuar.");return;}
api.client.auth.onAuthStateChange((_event,s)=>{if(s?.user.id!==user.id)setTimeout(()=>location.reload(),0);});
const fmt=new Intl.DateTimeFormat("pt-BR",{timeZone:"Europe/Paris",dateStyle:"full",timeStyle:"short"});
const parisParts=new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Paris",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"});
const parts=d=>Object.fromEntries(parisParts.formatToParts(d).filter(p=>p.type!=="literal").map(p=>[p.type,p.value]));
function parisDate(day,time){const desired=Date.parse(day+"T"+time+":00Z");if(!Number.isFinite(desired))throw Error("Data inválida.");let t=desired;for(let i=0;i<3;i++){const p=parts(new Date(t));const shown=Date.parse(p.year+"-"+p.month+"-"+p.day+"T"+p.hour+":"+p.minute+":00Z");t+=desired-shown;}const p=parts(new Date(t));if(p.year+"-"+p.month+"-"+p.day!==day||p.hour+":"+p.minute!==time)throw Error("Horário inválido no fuso de Paris.");return new Date(t);}
const names={pt:"Português",es:"Espanhol",de:"Alemão",other:"Idiomas"};
let busy=false;async function run(work){if(busy)return;busy=true;document.querySelectorAll("button").forEach(b=>b.disabled=true);try{await work();}catch(e){status(e.message||"Erro inesperado.");}finally{busy=false;document.querySelectorAll("button").forEach(b=>b.disabled=false);}}
function card(slot,label,action,style=""){const el=document.createElement("div");el.className="slot "+style;const info=document.createElement("div"),title=document.createElement("strong"),sub=document.createElement("p");title.textContent=(names[slot.language]||"Idiomas")+" · "+fmt.format(new Date(slot.starts_at));sub.className="muted";sub.textContent=Math.round((Date.parse(slot.ends_at)-Date.parse(slot.starts_at))/60000)+" min · "+label;info.append(title,sub);el.append(info);if(action){const btn=document.createElement("button");btn.type="button";btn.textContent=action.label;btn.onclick=()=>run(action.run);el.append(btn);}return el;}
function empty(el,msg){if(!el.children.length)el.textContent=msg;}
async function book(slot,retry=false){if(!retry&&!confirm("Confirmar aula de "+names[slot.language]+" em "+fmt.format(new Date(slot.starts_at))+"?"))return;status("Confirmando com o Google Agenda…");const {data,error}=await client.functions.invoke("book-lesson",{body:{slot_id:slot.id}});let message=data?.error;if(error){try{message=(await error.context.json()).error||message;}catch(_){}status(message||"Não foi possível confirmar a reserva.");}else status(data?.state==="confirmed"?"Aula confirmada! Compromisso criado na agenda do professor.":message||"Confirmação pendente.");await refresh();}
async function refresh(){const {data:slots,error:s}=await client.from("lesson_slots").select("id,starts_at,ends_at,language,reserved").order("starts_at");if(s)throw s;const {data:bookings,error:b}=await client.from("lesson_bookings").select("id,slot_id,student_id,student_label,state,week_start,lesson_slots(id,starts_at,ends_at,language)").order("created_at",{ascending:false});if(b)throw b;const available=$("slots"),mine=$("bookings"),teacher=$("teacherSlots");available.replaceChildren();mine.replaceChildren();teacher.replaceChildren();const my=bookings.filter(x=>x.student_id===user.id);const cutoff=Date.now()+72*3600000;
for(const slot of slots){if(!slot.reserved&&Date.parse(slot.starts_at)>=cutoff){available.append(card(slot,"Disponível",{label:"Reservar",run:()=>book(slot)}));}if(api.isEditor&&Date.parse(slot.ends_at)>Date.now()){const booking=bookings.find(x=>x.slot_id===slot.id);teacher.append(card(slot,booking?(booking.state==="confirmed"?"Confirmada":"Pendente")+" · "+booking.student_label:"Disponível",slot.reserved?null:{label:"Remover",run:async()=>{if(!confirm("Remover este horário?"))return;const {error}=await client.from("lesson_slots").delete().eq("id",slot.id);if(error)throw error;status("Horário removido.");await refresh();}}));}}
for(const b of my){const slot=b.lesson_slots;if(!slot)continue;mine.append(card(slot,b.state==="confirmed"?"Confirmada no Google Agenda":"Pendente de confirmação",b.state==="pending"?{label:"Tentar novamente",run:()=>book(slot,true)}:null,b.state));}
empty(available,"Nenhum horário disponível com 72 horas de antecedência.");empty(mine,"Você ainda não reservou aulas.");empty(teacher,"Nenhum horário futuro publicado.");}
$("available").hidden=false;$("mine").hidden=false;$("admin").hidden=!api.isEditor;
$("publish").onsubmit=e=>{e.preventDefault();run(async()=>{if(!api.isEditor)return;const start=parisDate($("day").value,$("time").value),duration=Number($("duration").value);if(start.getTime()<Date.now()+72*3600000)throw Error("Publique um horário com pelo menos 72 horas de antecedência.");const end=new Date(start.getTime()+duration*60000);const {error}=await client.from("lesson_slots").insert({starts_at:start.toISOString(),ends_at:end.toISOString(),language:$("language").value});if(error)throw Error(error.code==="23P01"?"Este horário se sobrepõe a outro já publicado.":error.message);status("Horário publicado.");await refresh();});};
try{await refresh();status("");}catch(e){status("Não foi possível carregar os horários: "+e.message);}
})();
</script></body></html>
