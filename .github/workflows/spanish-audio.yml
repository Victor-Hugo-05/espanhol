name: Generate Spanish verb audio
on:
  push:
    paths:
      - 'scripts/generate-spanish-audio.py'
      - '.github/workflows/spanish-audio.yml'
      - 'verbs-es-present-*.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install speech generator
        run: pip install 'edge-tts>=7.0,<8.0'
      - name: Generate all Spanish MP3s
        run: python scripts/generate-spanish-audio.py
      - name: Commit generated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/es-present/
          if ! git diff --cached --quiet; then
            git commit -m "Add 200 recorded Spanish pronunciation clips"
            git push
          fi
