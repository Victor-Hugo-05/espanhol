<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spanish App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="home">

  <div class="home-container">

    <section class="home-section" aria-labelledby="studyTitle">
      <h1 id="studyTitle">Español</h1>
      <div class="home-grid">
        <div class="card" onclick="goToQuiz()" role="button" tabindex="0" data-icon="🇪🇸">
          <h2>Preposiciones</h2>
          <p>Fill the blanks quiz</p>
        </div>

        <div class="card" onclick="goToFlashcards()" role="button" tabindex="0" data-icon="📚">
          <h2>Flashcards</h2>
          <p>Portugués → Español</p>
        </div>
      </div>
    </section>

    <section class="home-section" aria-labelledby="gamesTitle">
      <h2 id="gamesTitle" class="section-title">Juegos</h2>
      <div class="home-grid">
        <div class="card" onclick="goToQuienEsQuien()" role="button" tabindex="0" data-icon="🎲">
          <h2>Quien es quien</h2>
          <p>Juego para dos jugadores</p>
        </div>
      </div>
    </section>

  </div>

  <script>
    function goToQuiz() {
      window.location.href = "quiz.html";
    }
    function goToFlashcards() {
      window.location.href = "flashcards.html";
    }
    function goToQuienEsQuien() {
      window.location.href = "juegos/quien-es-quien/index.html";
    }
  </script>

</body>
</html>
