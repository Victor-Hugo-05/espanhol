<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portuguese Verb Challenge</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="verb-challenge.css">
  <link rel="stylesheet" href="verb-challenge-es.css?v=20261117">
</head>
<body class="verb-challenge">
  <div class="container verb-container">
    <a class="back-link" href="index.html">← Voltar ao início</a>
    <h1>🇧🇷 Verb Challenge</h1>

    <button id="verbVisibilityBtn" type="button">Ocultar verbo em português</button>

    <div id="setup" class="verb-setup">
      <fieldset class="verb-checks">
        <legend>Quais verbos você quer praticar?</legend>
        <label class="verb-check-option"><input id="regularVerbs" type="checkbox" checked> <span>Verbos regulares</span></label>
        <label class="verb-check-option"><input id="irregularVerbs" type="checkbox" checked> <span>Verbos irregulares</span></label>
      </fieldset>
      <label for="categorySelect">Qual tempo verbal você quer praticar?</label>
      <select id="categorySelect">
        <option value="all">Todas as categorias</option>
        <option value="present">Presente</option>
        <option value="preterite">Pretérito perfeito</option>
        <option value="gerund">Gerúndio</option>
        <option value="participle">Particípio passado</option>
        <option value="pronominal">Verbos reflexivos / pronominais</option>
        <option value="future_preterite">Futuro do pretérito</option>
        <option value="present_subjunctive">Presente do subjuntivo</option>
        <option value="imperfect_subjunctive">Pretérito imperfeito do subjuntivo</option>
        <option value="conditional">PIS + Futuro do pretérito</option>
        <option value="imperative">Imperativo (afirmativo e negativo)</option>
        <option value="futuro_subjuntivo">Futuro do subjuntivo</option>
        <option value="futuro_presente">Futuro do presente</option>
      </select>

      <label for="questionCount">Número de perguntas</label>
      <input id="questionCount" type="number" min="1" max="950" value="20">

      <div id="availableCount" class="available-count" aria-live="polite"></div>
      <button id="startVerbBtn" type="button">Começar</button>
    </div>

    <div id="game" class="verb-game" style="display:none;">
      <div class="verb-topbar">
        <span id="verbProgress">1 / 20</span>
        <span id="verbScore">Score: 0</span>
      </div>

      <div class="verb-question-card">
        <div id="englishSentence" class="verb-english"></div>
        <div id="portugueseSentence" class="verb-portuguese"></div>
        <div id="verbHint" class="verb-hint"></div>
      </div>

      <input id="verbAnswer" type="text" placeholder="Type the Portuguese form..." autocomplete="off">
      <input id="verbAnswer2" type="text" placeholder="Type the second Portuguese form..." autocomplete="off" style="display:none;">
      <button id="checkVerbBtn" type="button">✔ Check</button>
      <div id="verbFeedback" class="verb-feedback"></div>
      <button id="pronounceVerbBtn" class="verb-pronounce-btn" type="button" style="display:none;" aria-label="Ouvir frase em português">🔊 Ouvir frase</button>
      <button id="nextVerbBtn" type="button" style="display:none;">➡ Next</button>
    </div>
  </div>

  <script src="verb-challenge.js?v=20261117-2"></script>
</body>
</html>
